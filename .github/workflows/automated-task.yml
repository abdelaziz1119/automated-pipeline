name: Automated AI Pipeline

# ============================================================
# Trigger every 4 hours + manual dispatch.
# Cron offset of :17 avoids GitHub's top-of-hour schedule congestion.
# All cron times are in UTC.
#
# Prerequisites (see README.md):
#   - Repo variable STATUS_REPO (e.g. "your-username/pipeline-status")
#   - Repo secret  STATUS_REPO_TOKEN (fine-grained PAT with contents:write
#     and issues:write on the status repo)
#   - Optional secret OPENAI_API_KEY for LLM-enhanced content
#     (omitted = $0/month, rule-based fallback used instead)
# ============================================================
on:
  schedule:
    - cron: "17 */4 * * *"   # Every 4 hours at :17 UTC
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force a full pipeline run"
        type: boolean
        default: true

permissions:
  contents: write            # Push generated content to this repo
  pages: write               # Deploy to GitHub Pages
  id-token: write            # OIDC for Pages deployment
  models: read               # GitHub Models free-tier (optional LLM)

concurrency:
  group: "automated-pipeline"
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # MUST be set as a repository variable — no silent default.
  # Create at: Settings → Secrets and variables → Actions → Variables
  STATUS_REPO: "${{ vars.STATUS_REPO }}"

jobs:
  # ============================================================
  # JOB 1: Run the AI-driven task, commit results, deploy Pages
  # ============================================================
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.task.outcome }}
      timestamp: ${{ steps.timestamp.outputs.time }}
      summary: ${{ steps.task-result.outputs.summary }}

    steps:
      - name: Validate configuration
        run: |
          if [ -z "${{ env.STATUS_REPO }}" ]; then
            echo "::error::Repository variable STATUS_REPO is not set."
            echo "Create it at: Settings → Secrets and variables → Actions → Variables"
            echo "Value should be 'owner/repo-name' of your status-tracking repository."
            exit 1
          fi
          if [ -z "${{ secrets.STATUS_REPO_TOKEN }}" ]; then
            echo "::error::Repository secret STATUS_REPO_TOKEN is not set."
            echo "Create a fine-grained PAT with contents:write and issues:write"
            echo "on the status repo, then add it as a secret."
            exit 1
          fi
          echo "STATUS_REPO = ${{ env.STATUS_REPO }}"
          echo "Configuration validated."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get execution timestamp
        id: timestamp
        run: echo "time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Core AI-driven task
      # Runs with NO paid API by default (rule-based fallback).
      # Set OPENAI_API_KEY secret to enable LLM-enhanced summaries.
      # ============================================================
      - name: Execute AI-driven task
        id: task
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/run_task.py \
            --output-dir site \
            --timestamp "${{ steps.timestamp.outputs.time }}"

      - name: Capture task result
        id: task-result
        if: always()
        run: |
          echo "summary=Task ${{ steps.task.outcome }}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Commit generated content to this repo
      # ============================================================
      - name: Commit generated content
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: automated content update

            Generated at ${{ steps.timestamp.outputs.time }}
            Pipeline status: success"
            git push
          fi

      # ============================================================
      # Deploy to GitHub Pages (single deployment path)
      # ============================================================
      - name: Set up Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        if: success()
        uses: actions/deploy-pages@v4

      # ============================================================
      # Log execution status to the SEPARATE status repo
      # ============================================================
      - name: Log execution status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.STATUS_REPO_TOKEN }}
        run: |
          python scripts/monitor.py \
            --status "${{ steps.task.outcome }}" \
            --timestamp "${{ steps.timestamp.outputs.time }}" \
            --run-id "${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --commit-sha "${{ github.sha }}" \
            --summary "${{ steps.task-result.outputs.summary }}" \
            --status-repo "${{ env.STATUS_REPO }}" \
            --actor "${{ github.actor }}" \
            --source-repo "${{ github.repository }}" \
            --stage "task"

      - name: Log deployment status
        if: always() && steps.deployment.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.STATUS_REPO_TOKEN }}
        run: |
          python scripts/monitor.py \
            --status "${{ steps.deployment.outcome }}" \
            --timestamp "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --run-id "${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --commit-sha "${{ github.sha }}" \
            --summary "Pages deployment: ${{ steps.deployment.outcome }}" \
            --status-repo "${{ env.STATUS_REPO }}" \
            --actor "${{ github.actor }}" \
            --source-repo "${{ github.repository }}" \
            --stage "deploy"
